<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <title>Docs · earth·gs</title>
  <meta name="description" content="How earth-gs works: the globe, time and sky, place status, data rules and licences." />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script>
    (function () {
      var theme = 'dark';
      try {
        var s = JSON.parse(localStorage.getItem('earth-gs:settings') || '{}');
        if (s.theme === 'light' || s.theme === 'dark') theme = s.theme;
        else if (s.theme === 'system') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      } catch (e) {}
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%2305070b' stroke='%23d9a84f' stroke-width='2'/%3E%3Cpath d='M4 16h24' stroke='%23d9a84f' stroke-width='1.5'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap"
  />
